repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.9.7
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format

- repo: https://github.com/sqlfluff/sqlfluff
  rev: 2.3.3
  hooks:
    - id: sqlfluff-lint
      args: ["--dialect", "mysql"]
    - id: sqlfluff-fix
      args: ["--dialect", "mysql"]